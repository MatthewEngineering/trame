name: Deploy Streamlit to Azure

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # ================================
  # 1️⃣ Build & Push Docker Image
  # ================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # for GHCR
      id-token: write   # for Azure OIDC login
    outputs:
      image-sha: ${{ steps.set-image.outputs.image-sha }}

    steps:
      # Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # Login to GHCR
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Build Docker image
      - name: Build Docker image
        id: set-image
        run: |
          IMAGE_SHA=${GITHUB_SHA}
          docker build -t ghcr.io/matthewengineering/trame:latest \
                       -t ghcr.io/matthewengineering/trame:$IMAGE_SHA .
          echo "IMAGE_SHA=$IMAGE_SHA" >> $GITHUB_ENV
          echo "::set-output name=image-sha::$IMAGE_SHA"

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ghcr.io/matthewengineering/trame:latest
          docker push ghcr.io/matthewengineering/trame:${{ env.IMAGE_SHA }}
