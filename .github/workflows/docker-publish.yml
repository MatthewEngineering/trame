name: Docker Build & Push

on:
  push:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # needed for cosign ephemeral signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login to GHCR
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up Buildx (multi-platform support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Docker image
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./examples/06_vtk/04_wasm
          push: true
          tags: |
            matthewengineering/${{ env.IMAGE_NAME }}:latest
          # Push the digest tag separately after build
          outputs: type=docker
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Capture the image digest
      - name: Capture image digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest)
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV

      # Tag the image by its digest and push
      - name: Push digest tag
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest $IMAGE_DIGEST
          docker push $IMAGE_DIGEST

      # Optional: sign the image
      - name: Sign the image
        run: |
          cosign sign --yes $IMAGE_DIGEST
